name: carwash_manager
description: "Al Sewar Branch Manager App — for branch managers only."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # State management — provides Riverpod providers and ConsumerWidget
  flutter_riverpod: ^2.6.1

  # Annotation helpers that pair with riverpod_generator for cleaner provider syntax
  riverpod_annotation: ^2.6.1

  # HTTP client — used for all REST API calls to the backend
  dio: ^5.8.0+1

  # Secure token storage — stores JWT tokens in the device's keychain/keystore
  flutter_secure_storage: ^9.2.4

  # Declarative navigation and routing
  go_router: ^14.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended Flutter lint rules
  flutter_lints: ^6.0.0

  # Code generator — reads @riverpod annotations and generates provider boilerplate
  riverpod_generator: ^2.6.3

  # Runs code generators (like riverpod_generator) during development
  build_runner: ^2.4.15

  # Lint rules specific to Riverpod best practices
  riverpod_lint: ^2.6.3

  # Required peer dependency for riverpod_lint to work
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
  # assets and fonts will be added here as the project grows
